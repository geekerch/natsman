<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NATS Manager</title>
    <link rel="stylesheet" href="style.css">
    <script>
        window.onerror = function (msg, url, line, col, error) {
            console.error("Global Error: " + msg + "\nurl: " + url + "\nline: " + line);
            return false;
        };
    </script>
</head>

<body>
    <div class="app">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo-brand">
                    <div class="logo-icon">N</div>
                    <span class="brand-name">NATS Manager</span>
                </div>
            </div>

            <div class="sidebar-search">
                <input type="text" id="template-search" placeholder="Search templates..." class="search-input">
            </div>

            <div class="sidebar-section">
                <div class="section-header">
                    <span class="section-title">Templates</span>
                    <div class="section-actions">
                        <button class="btn-icon-sm" id="add-folder-btn" title="New Folder">
                            <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <path d="M1 3h3l1 1h6v6H1V3z" />
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="template-list" id="template-list">
                    <!-- Templates injected here -->
                </div>
            </div>

            <div class="sidebar-footer">
                <button class="sidebar-action-btn" id="globals-btn" title="Global Variables">
                    <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor"
                        stroke-width="1.5">
                        <circle cx="9" cy="9" r="7" />
                        <path d="M1 9h16M9 1a7 7 0 017 7 7 7 0 01-7 7 7 7 0 01-7-7 7 7 0 017-7z" />
                    </svg>
                    <span>Globals</span>
                </button>
                <button class="sidebar-action-btn" id="settings-btn" title="Settings">
                    <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor"
                        stroke-width="1.5">
                        <circle cx="9" cy="9" r="3" />
                        <path
                            d="M9 1v2m0 12v2M17 9h-2M3 9H1m13.5-6.5l-1.4 1.4m-10.2 10.2L1.5 15.5m14-1l-1.4-1.4m-10.2-10.2L1.5 1.5" />
                    </svg>
                    <span>Settings</span>
                </button>
            </div>

            <button class="sidebar-toggle" id="sidebar-toggle" title="Toggle Sidebar">
                <svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor">
                    <path d="M5 2L10 7L5 12V2Z" />
                </svg>
            </button>

            <div class="sidebar-resize-handle" id="sidebar-resize-handle"></div>
        </aside>

        <!-- Main Content -->
        <div class="main-container">
            <!-- Request Panel -->
            <div class="request-panel">
                <div class="request-header">
                    <input type="text" id="template-name" class="template-name-input" placeholder="Untitled Template" />
                    <div class="header-actions">
                        <button class="btn-secondary btn-sm" id="save-btn">
                            <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor"
                                stroke-width="1.5">
                                <path d="M11 1H3C1.9 1 1 1.9 1 3v8c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V3c0-1.1-.9-2-2-2z" />
                                <path d="M10 1v4H4V1" />
                            </svg>
                            Save
                        </button>
                        <button class="btn-secondary btn-sm" id="delete-btn">
                            <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor"
                                stroke-width="1.5">
                                <path d="M1 3h12M11 3v9a1 1 0 01-1 1H4a1 1 0 01-1-1V3M5 3V1h4v2" />
                            </svg>
                            Delete
                        </button>
                    </div>
                </div>

                <!-- Tab Navigation -->
                <div class="request-tabs">
                    <button class="request-tab active" data-tab="request">Request</button>
                    <button class="request-tab" data-tab="variables">Variables</button>
                </div>

                <div class="request-config">
                    <!-- Request Tab -->
                    <div class="tab-pane active" data-pane="request">
                        <div class="config-row">
                            <label class="config-label">Subject</label>
                            <input type="text" id="subject-input" class="subject-input"
                                placeholder="service.action.{{.id}}" />
                        </div>

                        <div class="config-section">
                            <label class="config-label">Payload</label>
                            <textarea id="payload-input" class="payload-editor"
                                placeholder='{"action": "{{.action}}", "data": "{{.data}}"}'></textarea>
                        </div>
                    </div>

                    <!-- Variables Tab -->
                    <div class="tab-pane" data-pane="variables">
                        <div class="variables-section">
                            <div class="variables-header">
                                <h3 class="variables-title">Local Variables</h3>
                                <span class="variables-count" id="variables-count">0 variables</span>
                            </div>
                            <div class="variables-grid" id="variables-grid">
                                <!-- Variables injected here -->
                            </div>
                        </div>
                    </div>

                    <div class="action-section">
                        <button class="btn-send" id="send-btn">
                            <svg width="18" height="18" viewBox="0 0 18 18" fill="currentColor">
                                <path d="M1 8l16-7-6 16-3-9-7 0z" />
                            </svg>
                            Send Request
                        </button>
                    </div>
                </div>
            </div>

            <!-- Response Panel -->
            <div class="response-panel" id="response-panel">
                <div class="resize-handle" id="resize-handle"></div>
                <div class="response-header">
                    <div class="response-tabs">
                        <button class="tab active" data-tab="body">Body</button>
                        <button class="tab" data-tab="info">Info</button>
                    </div>
                    <div class="response-meta">
                        <span class="response-status" id="response-status"></span>
                        <span class="response-time" id="response-time"></span>
                    </div>
                </div>
                <div class="response-body">
                    <div class="tab-content active" data-content="body">
                        <pre class="response-code" id="response-output">Click "Send Request" to see the response</pre>
                    </div>
                    <div class="tab-content" data-content="info">
                        <div class="info-grid" id="info-grid">
                            <div class="info-item">
                                <span class="info-label">Subject</span>
                                <span class="info-value" id="info-subject">-</span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">Payload Size</span>
                                <span class="info-value" id="info-size">-</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal" id="settings-modal">
        <div class="modal-backdrop"></div>
        <div class="modal-dialog">
            <div class="modal-header">
                <h2 class="modal-title">Connection Settings</h2>
                <button class="modal-close" id="settings-close">
                    <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="4" y1="4" x2="14" y2="14" />
                        <line x1="14" y1="4" x2="4" y2="14" />
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <div class="profile-selector">
                    <label class="form-label">Profile</label>
                    <div class="profile-controls">
                        <select id="nats-profile-select" class="form-select">
                            <!-- Profiles injected here -->
                        </select>
                        <button class="btn-icon-sm" id="new-nats-profile-btn" title="New Profile">
                            <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <line x1="6" y1="1" x2="6" y2="11" />
                                <line x1="1" y1="6" x2="11" y2="6" />
                            </svg>
                        </button>
                        <button class="btn-icon-sm" id="delete-nats-profile-btn" title="Delete Profile">
                            <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <line x1="3" y1="3" x2="9" y2="9" />
                                <line x1="9" y1="3" x2="3" y2="9" />
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">NATS Server URL</label>
                    <input type="text" id="config-url" class="form-input" placeholder="nats://localhost:4222">
                </div>
                <div class="form-group">
                    <label class="form-label">Credentials File Path</label>
                    <input type="text" id="config-creds" class="form-input" placeholder="/path/to/user.creds">
                    <small class="form-hint">Leave empty if not using authentication</small>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" id="cancel-settings-btn">Cancel</button>
                <button class="btn-primary" id="save-settings-btn">Save Profile</button>
            </div>
        </div>
    </div>

    <!-- Globals Modal -->
    <div class="modal" id="globals-modal">
        <div class="modal-backdrop"></div>
        <div class="modal-dialog">
            <div class="modal-header">
                <h2 class="modal-title">Global Variables</h2>
                <button class="modal-close" id="globals-close">
                    <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="4" y1="4" x2="14" y2="14" />
                        <line x1="14" y1="4" x2="4" y2="14" />
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <div class="profile-selector">
                    <label class="form-label">Profile</label>
                    <div class="profile-controls">
                        <select id="globals-profile-select" class="form-select">
                            <!-- Profiles injected here -->
                        </select>
                        <button class="btn-icon-sm" id="new-globals-profile-btn" title="New Profile">
                            <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <line x1="6" y1="1" x2="6" y2="11" />
                                <line x1="1" y1="6" x2="11" y2="6" />
                            </svg>
                        </button>
                        <button class="btn-icon-sm" id="delete-globals-profile-btn" title="Delete Profile">
                            <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <line x1="3" y1="3" x2="9" y2="9" />
                                <line x1="9" y1="3" x2="3" y2="9" />
                            </svg>
                        </button>
                    </div>
                </div>
                <div id="globals-list">
                    <!-- Global variables -->
                </div>
                <button class="btn-secondary btn-sm" id="add-global-btn">
                    <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="6" y1="1" x2="6" y2="11" />
                        <line x1="1" y1="6" x2="11" y2="6" />
                    </svg>
                    Add Variable
                </button>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" id="cancel-globals-btn">Cancel</button>
                <button class="btn-primary" id="save-globals-btn">Save Profile</button>
            </div>
        </div>
    </div>

    <!-- Confirm Modal -->
    <div class="modal" id="confirm-modal">
        <div class="modal-backdrop"></div>
        <div class="modal-dialog modal-sm">
            <div class="modal-header">
                <h2 class="modal-title">Confirm Action</h2>
                <button class="modal-close" id="confirm-close">
                    <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="4" y1="4" x2="14" y2="14" />
                        <line x1="14" y1="4" x2="4" y2="14" />
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <p id="confirm-message">Are you sure?</p>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" id="confirm-cancel-btn">Cancel</button>
                <button class="btn-primary" id="confirm-ok-btn">Confirm</button>
            </div>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>
    <script src="app.js"></script>
</body>

</html>
